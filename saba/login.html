<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
     <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm">
        <div class="container">

            <a href="index.html" class="navbar-brand fw-bold fs-3">
                🐾 Paw<span style="color:#7837e8;">Care</span>
            </a>

            <div class="navbar-nav ms-auto gap-3">
                <a href="index.html" class="nav-link">Home</a>
                <a href="service.html" class="nav-link">Services</a>
                 <a href="register.html" class="nav-link">Register</a>
            </div>

        </div>
    </nav>


    <!-- LOGIN SECTION -->
    <section class="py-5" style="background:#f5efff; min-height:80vh;">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="bg-white p-5 rounded-4 shadow">

                        <div class="text-center mb-4">

                            <div style="font-size:45px;">🐾</div>

                            <h2 class="fw-bold">
                                Welcome Back!
                            </h2>

                            <p class="text-secondary">
                                Login to your PawCare account
                            </p>

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control py-2"
                                   placeholder="Enter your email">

                        </div>


                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control py-2"
                                   placeholder="Enter your password">

                        </div>


                        <!-- REMEMBER -->
                        <div class="d-flex justify-content-between mb-4">

                            <div>
                                <input type="checkbox">
                                <span class="text-secondary">
                                    Remember me
                                </span>
                            </div>

                            <a href="#" style="color:#7837e8;">
                                Forgot Password?
                            </a>

                        </div>


                        <!-- LOGIN BUTTON -->
                        <button class="btn text-white w-100 py-2"
                                style="background:#7837e8;">

                            Login 🐾

                        </button>


                        <!-- REGISTER -->
                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="register.html"
                               class="fw-semibold"
                               style="color:#7837e8;">

                                Register

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 PawCare. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
