<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PawCar</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm">

        <div class="container">

            <!-- Logo -->
            <a href="index.html" class="navbar-brand fw-bold fs-3">
                🐾 Paw<span style="color:#7837e8;">Care</span>
            </a>

            <!-- Menu -->
            <div class="navbar-nav ms-auto gap-3">

                <a href="index.html" class="nav-link">
                    Home
                </a>

                <a href="service.html" class="nav-link">
                    Services
                </a>

                <a href="login.html" class="nav-link">
                    Login
                </a>

                <a href="register.html" class="nav-link fw-semibold">
                    Register
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= REGISTER SECTION ================= -->

    <section class="py-5"
        style="background:#f5efff; min-height:85vh;">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-5">

                    <!-- Register Card -->
                    <div class="bg-white p-5 rounded-4 shadow">

                        <!-- Heading -->
                        <div class="text-center mb-4">

                            <div class="fs-1 mb-2">
                                🐾
                            </div>

                            <h2 class="fw-bold">
                                Create Account
                            </h2>

                            <p class="text-secondary mb-0">
                                Join PawCare today
                            </p>

                        </div>


                        <!-- Full Name -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Full Name
                            </label>

                            <input type="text"
                                class="form-control py-2"
                                placeholder="Enter your name">

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input type="email"
                                class="form-control py-2"
                                placeholder="Enter your email">

                        </div>


                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Phone Number
                            </label>

                            <input type="tel"
                                class="form-control py-2"
                                placeholder="Enter your phone number">

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input type="password"
                                class="form-control py-2"
                                placeholder="Create a password">

                        </div>


                        <!-- Confirm Password -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Confirm Password
                            </label>

                            <input type="password"
                                class="form-control py-2"
                                placeholder="Confirm your password">

                        </div>


                        <!-- Register Button -->
                        <button class="btn text-white w-100 py-2 fw-semibold"
                            style="background:#7837e8;">

                            Register 🐾

                        </button>


                        <!-- Login Link -->
                        <p class="text-center mt-4 mb-0">

                            Already have an account?

                            <a href="login.html"
                                class="text-decoration-none fw-semibold"
                                style="color:#7837e8;">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>
   
    <footer class="bg-dark text-white py-3">

        <div class="container text-center">

            <small>
                © 2026 PawCare. All Rights Reserved.
            </small>

        </div>

    </footer>

</body>

</html>  
</body>
</html>
